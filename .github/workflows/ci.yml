name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -v -race ./...

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          for pkg in $(go list ./...); do
            # Skip packages without test files to avoid covdata errors
            if ! go list -f '{{join .TestGoFiles " "}}' "$pkg" | grep -q '_test.go'; then
              echo "SKIP (no tests): $pkg"
              continue
            fi
            go test -coverprofile="coverage/$(echo $pkg | tr / _).out" -covermode=atomic "$pkg"
          done
          echo "mode: atomic" > coverage.out
          for f in coverage/*.out; do grep -v "^mode:" "$f" >> coverage.out; done
          echo "Coverage summary:"
          go tool cover -func=coverage.out | tail -1

      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=XXX ./...
