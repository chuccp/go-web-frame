site_name: Go Web Frame User Guide
site_url: https://chuccp.github.io/go-web-frame/en/
site_description: Go Web Frame official documentation (English)
site_author: Go Web Frame Team

docs_dir: docs-en
site_dir: site-en

theme:
  name: material
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Hello World: getting-started/hello-world.md
  - Guide:
      - Routing: guide/routing.md
      - Controller: guide/controller.md
      - Model: guide/model.md
      - Service: guide/service.md
      - Filter/Middleware: guide/filter.md
      - Converter: guide/converter.md
      - Error Code: guide/error-code.md
      - Configuration: guide/configuration.md
      - Logging: guide/logging.md
      - Runner: guide/runner.md
      - Components: guide/components.md
  - Advanced:
      - Database: advanced/database.md
      - Deployment: advanced/deployment.md
  - API Reference:
      - Core API: api/core.md
      - Web API: api/web.md
      - Model API: api/model.md
      - Util API: api/util.md
  - Best Practices: best-practices.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chuccp/go-web-frame
  alternate:
    - name: English
      link: https://chuccp.github.io/go-web-frame/en/
      lang: en
    - name: 中文
      link: https://chuccp.github.io/go-web-frame/zh/
      lang: zh